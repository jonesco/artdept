<style>
/* Single look: the creature on off-white paper, like the source print. Caption strip with a
   two-way switch above, the art scaled to fit, a one-line hint below. */
:root {
  --bg: #f3f3ee;
  --fg: #1b1d18;
  --muted: #6a6c62;
  --accent: #0b8587;
  --line: #dcddd4;
  --chip: #e6e7df;
  --display: "DotGothic16", ui-monospace, "SF Mono", Menlo, monospace;
  --label: "Silkscreen", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--display);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* label and controls at the top */
  gap: 12px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  cursor: crosshair;
  -webkit-user-select: none;
  user-select: none;
}
.cap, .hint { width: 100%; max-width: 640px; }
.cap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--line);
  padding-bottom: 10px;
}
h1 { margin: 0; font-weight: 400; font-size: 28px; line-height: 1; display: flex; align-items: baseline; gap: 12px; }
/* The name in the Jonesco headline face, Trade Gothic Bold Condensed No. 20 */
@font-face { font-family: 'Trade Gothic Bold Cond 20'; src: url('https://design.jonesco.com/v/1.3.0/fonts/TradeGothic-BoldCondTwenty.woff2') format('woff2'); font-weight: 700; font-display: swap; }
h1 .latin { font-family: 'Trade Gothic Bold Cond 20', 'Libre Franklin', sans-serif; font-weight: 700; font-size: 34px; line-height: .8; letter-spacing: .01em; text-transform: uppercase; color: var(--fg); }
.right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.meta { margin: 0; font-family: var(--label); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--accent); font-weight: 400; }
.switch { display: inline-flex; border: 2px solid var(--fg); }
.switch button {
  font: inherit; font-family: var(--label); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  background: transparent; color: var(--fg); border: 0; padding: 6px 12px; cursor: pointer;
}
.switch button + button { border-left: 2px solid var(--fg); }
.switch button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.switch button:hover:not([aria-pressed="true"]) { background: var(--chip); }
.switch button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* On phones the seven buttons become one dropdown. */
.pick { display: none; position: relative; }
.pick select {
  appearance: none; -webkit-appearance: none; border-radius: 0;
  font: inherit; font-family: var(--label); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg); background: var(--bg); border: 2px solid var(--fg);
  padding: 8px 40px 8px 12px; min-height: 40px; cursor: pointer;
}
.pick::after {
  content: ""; position: absolute; right: 14px; top: 50%; margin-top: -3px; pointer-events: none;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--fg);
}
.pick select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  .switch { display: none; }
  .pick { display: block; }
}
.stage { position: relative; flex: none; margin-block: auto; } /* creature centered in the space below */
canvas { display: block; position: absolute; }
#pixel, #dither { image-rendering: crisp-edges; image-rendering: pixelated; }
.hint { display: none; }
</style>

    const ORDER = ["k", "t", "d", "c", "g", "y", "w"]; // back to front
    const FILL = { k: "#2a2b26", t: "#1d8786", d: "#3f8f50", c: "#33b2ae", g: "#7fbd52", y: "#f1dd3c", w: "#f8f4e4" };

        const tl = v(x, y) >= T, tr = v(x + 1, y) >= T, br = v(x + 1, y + 1) >= T, bl = v(x, y + 1) >= T;

          case 3: case 12: link(lef(), rig()); break;
          case 4: case 11: link(top(), rig()); break;
          case 6: case 9: link(top(), bot()); break;

    };
    const chaikin = L => {
      const out = [];
      for (let i = 0; i < L.length; i++) {

    // Cut the sheets once onto an offscreen canvas, each with a short soft shadow (kept light),
    // then each frame only the pupils and lids are drawn over it.
    const R = 4, CW = W * R, CH = H * R;
    const toPx = c => { c.setTransform(R, 0, 0, R, R * 0.5, R * 0.5); };
    const sheet = document.createElement("canvas"); sheet.width = CW; sheet.height = CH;

    const ctx = cv.getContext("2d");
    return {
      W, H, eyes, box: [27.64, 76.85, W * 2, H * 2],
      draw(now) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);

          ctx.save(); ctx.shadowColor = "transparent";

        }
      },
    };
  }

  // ---- 1-bit version -------------------------------------------------------------------
  // The pixel map turned into grey tones at twice its resolution, then Floyd–Steinberg error
  // diffusion down to two colors: ink and paper. Every tone is a pattern of dots.
  function buildDither(cv) {
    const map = parse(MAPS.pixel), { G, W, H } = map;
    const eyes = findEyes(map, 10);
    const U = 2, DW = W * U, DH = H * U;
    const TONE = { k: 0, t: 0.24, d: 0.3, c: 0.44, g: 0.6, y: 0.9, w: 1, ".": 1 };
    const INK = [27, 29, 24, 255], PAPER = [243, 243, 238, 255];
    const hash = (x, y, s) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
    const dither = grid => {
      const f = new Float32Array(DW * DH);
      for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
        const ch = grid[(y / U) | 0][(x / U) | 0], t = TONE[ch];
        // a whisper of noise in the mid-tones keeps the diffusion from settling into stripes
        f[y * DW + x] = t === 0 || t === 1 ? t : t + (hash(x, y, 5) - 0.5) * 0.08;
      }
      const out = new Uint8Array(DW * DH);
      for (let y = 0; y < DH; y++) {
        const ltr = y % 2 === 0, step = ltr ? 1 : -1; // serpentine scan
        for (let i = 0; i < DW; i++) {
          const x = ltr ? i : DW - 1 - i, k = y * DW + x, old = f[k], v = old < 0.5 ? 0 : 1, err = old - v;
          out[k] = v;
          if (x + step >= 0 && x + step < DW) f[k + step] += err * 7 / 16;
          if (y + 1 < DH) {
            if (x - step >= 0 && x - step < DW) f[k + DW - step] += err * 3 / 16;
            f[k + DW] += err * 5 / 16;

          }

      const img = new Uint8ClampedArray(DW * DH * 4);
      for (let k = 0; k < DW * DH; k++) img.set(out[k] ? PAPER : INK, k * 4);
      return img;
    };
    const base = dither(G);
    // every eye shut: body tone over the eye and a slit of ink that wanders a dot up or down
    const shut = G.map(r => r.slice());
    for (const e of eyes) for (const [x, y] of e.cells) shut[y][x] = "g";
    const closed = dither(shut);
    for (const e of eyes) {
      const xs = e.cells.map(c => c[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);

        e.slit.push([x, y], [x, y + 1]);

    cv.width = DW; cv.height = DH;
    const ctx = cv.getContext("2d"), frame = ctx.createImageData(DW, DH), D = frame.data;

    return {
      W, H, eyes, box: [26.42, 75.87, W * 3, H * 3],
      draw(now) {

            for (const [x, y] of e.cells) for (let j = 0; j < U; j++) for (let i = 0; i < U; i++) {
              const k = ((y * U + j) * DW + x * U + i) * 4; D.set(closed.subarray(k, k + 4), k);

          const { ox, oy } = place(e);
          for (const [i, j] of e.disc) {
            const hl = e.glint.has(i + "," + j);

      },
    };
  }

  // ---- ASCII version ---------------------------------------------------------------------
  // The riso map averaged into a grid of character cells; each cell's darkness picks a glyph
  // from the ramp. Pupils are glyphs too, with partial coverage at the rim softening the edge.
  function buildAscii(cv) {
    const map = parse(MAPS.riso), { G, W, H } = map;
    const eyes = findEyes(map, 20);
    const RAMP = " .,:-=+*%#@", N = RAMP.length - 1;
    const TONE = { k: 1, t: 0.62, d: 0.58, c: 0.5, g: 0.42, y: 0.22, w: 0, ".": 0 };
    const HUE = { k: "#1b1d18", t: "#08787a", d: "#2a7d3e", c: "#0f9fa1", g: "#5ea532", y: "#c9b400", w: "#1b1d18", ".": "#1b1d18" };
    const CX = 2, CY = 3.6, COLS = Math.round(W / CX), ROWS = Math.round(H / CY);
    const S = 2, PX = 3 * S; // canvas px per map cell
    const cw = CX * PX, chH = CY * PX;
    const INK = "#1b1d18", PAPER = "#f3f3ee", EYE = "#fdfaea";
    const span = (c, r) => [Math.floor(c * CX), Math.ceil((c + 1) * CX), Math.floor(r * CY), Math.min(H, Math.ceil((r + 1) * CY))];
    const glyph = t => RAMP[Math.max(0, Math.min(N, Math.round(Math.pow(t, 0.7) * N)))]; // curve pushes mid-tones denser
    const heavy = ch => RAMP.indexOf(ch) >= 7; // %, #, @ print bold
    const TINT = { k: "rgba(27,29,24,0.34)", t: "rgba(8,120,122,0.3)", d: "rgba(42,125,62,0.3)", c: "rgba(15,159,161,0.26)", g: "rgba(94,165,50,0.26)", y: "rgba(240,215,0,0.36)" };
    const toneAt = (grid, c, r) => {
      const [x0, x1, y0, y1] = span(c, r); let s = 0, n = 0;
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1 && x < W; x++) { s += TONE[grid[y][x]]; n++; }
      return n ? s / n : 0;
    };
    const hueAt = (grid, c, r) => {
      const [x0, x1, y0, y1] = span(c, r), n = {};
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1 && x < W; x++) { const k = grid[y][x]; n[k] = (n[k] || 0) + (k === "k" ? 1.3 : k === "." || k === "w" ? 0 : 1); }
      let best = "k", bv = -1; for (const k in n) if (n[k] > bv) { bv = n[k]; best = k; }
      return best;
    };
    const base = [], shutTone = [], hue = [], shutHue = [];
    const shut = G.map(r => r.slice());
    for (const e of eyes) for (const [x, y] of e.cells) shut[y][x] = "g";
    for (let r = 0; r < ROWS; r++) {
      base.push([]); shutTone.push([]); hue.push([]); shutHue.push([]);
      for (let c = 0; c < COLS; c++) {
        base[r].push(glyph(toneAt(G, c, r))); shutTone[r].push(glyph(toneAt(shut, c, r)));
        hue[r].push(hueAt(G, c, r)); shutHue[r].push(hueAt(shut, c, r));
      }
    }
    // which character cells belong to each eye (majority of their map cells are eye white)
    for (const e of eyes) {
      const xs = e.cells.map(q => q[0]), ys = e.cells.map(q => q[1]);
      e.c0 = Math.floor(Math.min(...xs) / CX); e.c1 = Math.floor(Math.max(...xs) / CX);
      e.r0 = Math.floor(Math.min(...ys) / CY); e.r1 = Math.floor(Math.max(...ys) / CY);
      e.own = [];
      for (let r = e.r0; r <= e.r1; r++) for (let c = e.c0; c <= e.c1; c++) {
        const [x0, x1, y0, y1] = span(c, r); let n = 0, m = 0;
        for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { n++; if (e.has.has(x + "," + y)) m++; }
        if (m / n >= 0.5) e.own.push([c, r]);
      }
      e.slitRow = Math.floor((e.midRow + 0.5) / CY);
    }
    cv.width = Math.round(COLS * cw); cv.height = Math.round(ROWS * chH);
    const ctx = cv.getContext("2d");
    const FACE = `${Math.round(chH * 0.92)}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
    const BOLD = "800 " + FACE;
    // one character cell: a light wash of its color behind, then the glyph, bold when dark
    const cell = (g, c, r, ch, key, eyeWhite) => {
      const x = Math.round(c * cw), y = Math.round(r * chH), w = Math.round((c + 1) * cw) - x, h = Math.round((r + 1) * chH) - y;
      if (eyeWhite) {
        // eye white: solid cream, then the pupil's ink wash in proportion to its coverage
        g.fillStyle = EYE; g.fillRect(x, y, w, h);
        if (eyeWhite > 0) { g.fillStyle = `rgba(27,29,24,${(0.4 * eyeWhite).toFixed(3)})`; g.fillRect(x, y, w, h); }
      } else if (TINT[key]) { g.fillStyle = TINT[key]; g.fillRect(x, y, w, h); }
      if (ch === " ") return;

      g.fillStyle = HUE[key];
      g.fillText(ch, x + w / 2, y + h / 2);
    };
    const sheet = document.createElement("canvas"); sheet.width = cv.width; sheet.height = cv.height;
    const sx = sheet.getContext("2d");
    sx.fillStyle = PAPER; sx.fillRect(0, 0, sheet.width, sheet.height);
    sx.textAlign = "center"; sx.textBaseline = "middle";
    const own = new Set(); for (const e of eyes) for (const [c, r] of e.own) own.add(c + "," + r);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cell(sx, c, r, base[r][c], hue[r][c], own.has(c + "," + r) ? -1 : 0);
    let first = true;

      W, H, eyes, box: [27.64, 76.85, W * 2, H * 2],
      draw(now) {
        if (first) { ctx.drawImage(sheet, 0, 0); first = false; }
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for (const e of eyes) {

          ctx.fillStyle = PAPER;
          for (const [c, r] of e.own) { const x = Math.round(c * cw), y = Math.round(r * chH); ctx.fillRect(x, y, Math.round((c + 1) * cw) - x, Math.round((r + 1) * chH) - y); }
          if (now < e.blinkEnd) {
            for (const [c, r] of e.own) r === e.slitRow ? cell(ctx, c, r, "=", "k", false) : cell(ctx, c, r, shutTone[r][c], shutHue[r][c], false);
            continue;
          }
          const { fx, fy } = place(e);
          const pr = e.D / 2, gx = fx + pr * 0.36, gy = fy - pr * 0.4;
          for (const [c, r] of e.own) {
            // fraction of this character covered by the pupil, sampled on a small grid
            let n = 0, m = 0, glint = false;
            for (let j = 0; j < 4; j++) for (let i = 0; i < 3; i++) {

              n++; if ((x - fx) ** 2 + (y - fy) ** 2 <= pr * pr) m++;
              if (e.D >= 6 && Math.abs(x - gx) < CX * 0.5 && Math.abs(y - gy) < CY * 0.5) glint = true;
            }
            cell(ctx, c, r, glint ? " " : glyph(m / n), "k", glint ? -1 : m / n || -1);
          }
        }
      },
    };
  }

  // ---- Riso version ----------------------------------------------------------------
  // Two spot-ink plates built offscreen from the map: per-cell ink densities, upsampled,
  // screened with a rotated halftone, speckled where the drum skipped, then multiplied
  // onto paper with the teal plate slightly off register.
  function buildRiso(cv) {
    const map = parse(MAPS.riso), { G, W, H } = map;
    const eyes = findEyes(map, 20);
    const R = 4, CW = W * R, CH = H * R;
    const PAPER = [243, 243, 238]; // same as the page, so the sheet has no visible edge
    const INK = { yellow: [255, 232, 0], teal: [0, 131, 138] };
    // [yellow, teal] coverage for each map character
    const DENS = { k: [1, 1], g: [1, 0.46], d: [1, 0.74], c: [0.04, 0.82], t: [0.2, 1], y: [1, 0], w: [0.05, 0], ".": [0, 0] };
    const MIS = { x: 2.6, y: -1.8, rot: 0.0022 };

    const hash = (x, y, s) => { const v = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return v - Math.floor(v); };
    const vnoise = (x, y, s) => {
      const x0 = Math.floor(x), y0 = Math.floor(y), tx = x - x0, ty = y - y0;
      const a = hash(x0, y0, s), b = hash(x0 + 1, y0, s), c = hash(x0, y0 + 1, s), d = hash(x0 + 1, y0 + 1, s);
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);

    const field = (idx, grid) => {
      const f = new Float32Array(W * H);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) f[y * W + x] = DENS[grid[y][x]][idx];
      return f;
    };
    const sample = (f, x, y) => {
      x = Math.min(W - 1, Math.max(0, x)); y = Math.min(H - 1, Math.max(0, y));
      const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1), tx = x - x0, ty = y - y0;
      const a = f[y0 * W + x0], b = f[y0 * W + x1], c = f[y1 * W + x0], d = f[y1 * W + x1];
      return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;

      const f = field(idx, grid), c = document.createElement("canvas");

      const ca = Math.cos(angle), sa = Math.sin(angle), P = 5.2, TAU = Math.PI * 2;

        const i = (y * CW + x) * 4, cover = 0.78 + 0.22 * vnoise(x / 70, y / 70, seed + 7);

      }

    };
    const tealT = ctx => { ctx.translate(CW / 2, CH / 2); ctx.rotate(MIS.rot); ctx.translate(-CW / 2 + MIS.x, -CH / 2 + MIS.y); };
    const print = grid => {
      const yellow = plate(0, INK.yellow, 0.26, 1, grid), teal = plate(1, INK.teal, 1.13, 2, grid);
      const sheet = document.createElement("canvas");
      sheet.width = CW; sheet.height = CH;
      const b = sheet.getContext("2d");
      b.fillStyle = `rgb(${PAPER})`; b.fillRect(0, 0, CW, CH);
      b.globalCompositeOperation = "multiply";
      b.drawImage(yellow, 0, 0);

    // the middle that wanders a cell up or down here and there so it reads hand-printed.
    const shut = G.map(r => r.slice());
    for (const e of eyes) {
      const xs = e.cells.map(c => c[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
      for (const [x, y] of e.cells) shut[y][x] = "g";
      for (const [x, y] of e.cells) {
        if (y !== e.midRow || x === x0 || x === x1) continue;
        shut[y][x] = "k";
        const r = hash(x, y, 31);
        if (r < 0.22 && e.has.has(x + "," + (y - 1))) shut[y - 1][x] = "k";
        else if (r > 0.8 && e.has.has(x + "," + (y + 1))) shut[y + 1][x] = "k";
      }
      e.clip = new Path2D();
      for (const [x, y] of e.cells) e.clip.rect(x * R - 1, y * R - 1, R + 2, R + 2);
    }
    const closed = print(shut);

    // Pupil plates: a grainy disc per ink, so the live pupils print like the rest.
    const discSprite = (r, rgb, seed) => {
      const s = Math.ceil(r * 2) + 4, c = document.createElement("canvas");
      c.width = c.height = s;
      const ctx = c.getContext("2d"), img = ctx.createImageData(s, s), D = img.data, m = s / 2;
      for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
        const n = hash(x, y, seed), d = Math.hypot(x + 0.5 - m, y + 0.5 - m);
        if (d > r + (n - 0.5) * 1.1 || n < 0.04) continue;
        const i = (y * s + x) * 4;
        D[i] = rgb[0]; D[i + 1] = rgb[1]; D[i + 2] = rgb[2]; D[i + 3] = 240;
      }
      ctx.putImageData(img, 0, 0);
      return c;
    };
    for (const e of eyes) {
      e.r = (e.D / 2) * R * 0.94;
      e.spY = discSprite(e.r, INK.yellow, 11 + e.D);
      e.spT = discSprite(e.r, INK.teal, 23 + e.D);
    }

    cv.width = CW; cv.height = CH;
    const ctx = cv.getContext("2d");
    return {
      W, H, eyes, box: [27.64, 76.85, W * 2, H * 2],
      draw(now) {
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(base, 0, 0);
        for (const e of eyes) {
          if (now < e.blinkEnd) {
            ctx.save(); ctx.clip(e.clip); ctx.drawImage(closed, 0, 0); ctx.restore();
            continue;
          }
          const { fx, fy } = place(e);
          const cx = (fx + 0.5) * R, cy = (fy + 0.5) * R, s = e.spY.width;
          ctx.globalCompositeOperation = "multiply";
          ctx.drawImage(e.spY, cx - s / 2, cy - s / 2);
          ctx.save(); tealT(ctx); ctx.drawImage(e.spT, cx - s / 2, cy - s / 2); ctx.restore();
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = `rgb(${PAPER})`;
          const hr = Math.max(1.6, e.r * 0.22);
          ctx.beginPath(); ctx.arc(cx + e.r * 0.38, cy - e.r * 0.4, hr, 0, Math.PI * 2); ctx.fill();
        }
      },
    };
  }

    const avW = window.innerWidth - 32, avH = Math.max(320, window.innerHeight - chrome);
    const dpr = window.devicePixelRatio || 1;
    let sc = Math.min(avW / FRAME[2], avH / FRAME[3]);
    sc = Math.max(1 / (3 * dpr), Math.floor(sc * 3 * dpr) / (3 * dpr)); // whole device pixels per pixel-art cell
    const snap = px => Math.round(px * dpr) / dpr;
    stage.style.width = snap(FRAME[2] * sc) + "px"; stage.style.height = snap(FRAME[3] * sc) + "px";
    const [bx, by, bw, bh] = v.box;
    Object.assign(cv.style, {
      left: snap((bx - FRAME[0]) * sc) + "px", top: snap((by - FRAME[1]) * sc) + "px",
      width: snap(bw * sc) + "px", height: snap(bh * sc) + "px",
    });
    cap.style.maxWidth = hint.style.maxWidth = Math.max(320, FRAME[2] * sc) + "px";
  };
  addEventListener("resize", fit);
  if (document.fonts) document.fonts.ready.then(fit);

  const show = name => {
    if (!builders[name]) name = "original";
    if (!views[name]) views[name] = builders[name](canvases[name]);
    view = name;
    for (const k in canvases) canvases[k].toggleAttribute("hidden", k !== name);
    for (const btn of document.querySelectorAll(".switch button")) btn.setAttribute("aria-pressed", String(btn.dataset.view === name));
    hint.textContent = HINTS[name];
    pick.value = name;
    document.getElementById("count").textContent = views[name].eyes.length;
    fit();
  };
  for (const btn of document.querySelectorAll(".switch button")) {
    btn.addEventListener("click", ev => {
      ev.stopPropagation();
      if (location.hash.slice(1) !== btn.dataset.view) location.hash = btn.dataset.view;
      else show(btn.dataset.view);
    });
    btn.addEventListener("pointerdown", ev => ev.stopPropagation());
  }
  addEventListener("hashchange", () => show(location.hash.slice(1)));
  pick.addEventListener("change", () => { location.hash = pick.value; });
  pick.addEventListener("pointerdown", ev => ev.stopPropagation());

  // ---- Pointer follow ----------------------------------------------------------------
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let ptr = null, lastMove = -1e9, glanceAt = performance.now() + 4000;
  const modeEl = document.getElementById("mode");
  const screenOf = (v, e, r) => [r.left + (e.cx + 0.5) * r.width / v.W, r.top + (e.cy + 0.5) * r.height / v.H];
  addEventListener("pointermove", e => { ptr = { x: e.clientX, y: e.clientY }; lastMove = performance.now(); });
  addEventListener("pointerdown", ev => {
    ptr = { x: ev.clientX, y: ev.clientY }; lastMove = performance.now();
    const v = views[view], r = canvases[view].getBoundingClientRect(), now = performance.now();
    for (const e of v.eyes) { const [ex, ey] = screenOf(v, e, r); e.blinkAt = now + Math.hypot(ex - ev.clientX, ey - ev.clientY) * 0.6; }
  });
  document.addEventListener("pointerleave", () => { lastMove = -1e9; });

  let prev = performance.now();
  const tick = now => {
    const dt = Math.min(64, now - prev) / 16.67; prev = now;
    const v = views[view], r = canvases[view].getBoundingClientRect();
    const idle = !ptr || now - lastMove > 1800;
    const mode = idle ? "wandering" : "watching you";
    if (modeEl.textContent !== mode) modeEl.textContent = mode;

    // Every so often the whole body glances the same way at once.
    let glance = null;
    if (idle && !reduce.matches && now > glanceAt) {
      glanceAt = now + 3000 + Math.random() * 4000;
      if (Math.random() < 0.45) { const a = Math.random() * Math.PI * 2; glance = [Math.cos(a), Math.sin(a) * 0.7]; }
    }
    for (const e of v.eyes) {
      if (!idle) {
        const [ex, ey] = screenOf(v, e, r);
        const vx = ptr.x - ex, vy = ptr.y - ey, d = Math.hypot(vx, vy) || 1;
        const mag = Math.min(1, d / (r.width * 0.3));
        e.tx = vx / d * mag; e.ty = vy / d * mag;
      } else if (reduce.matches) {
        e.tx = e.home ? e.home[0] : 0; e.ty = e.home ? e.home[1] : 0;
      } else {
        if (glance) { e.wx = glance[0]; e.wy = glance[1]; e.nextSacc = now + 900 + Math.random() * 1200; }
        else if (now > e.nextSacc) {
          if (e.home && Math.random() < 0.55) { e.wx = e.home[0]; e.wy = e.home[1]; }
          else { const a = Math.random() * Math.PI * 2, m = Math.random() ** 0.5; e.wx = Math.cos(a) * m; e.wy = Math.sin(a) * m; }
          e.nextSacc = now + 700 + Math.random() * 2600;
        }
        e.tx = e.wx; e.ty = e.wy;
      }
      const k = reduce.matches ? 1 : Math.min(1, e.k * dt);
      e.ax += (e.tx - e.ax) * k; e.ay += (e.ty - e.ay) * k;
      if (!reduce.matches && now > e.blinkAt && now > e.blinkEnd) {
        e.blinkEnd = now + 130;
        e.blinkAt = now + 2500 + Math.random() * 6500;
      }
    }
    v.draw(now);
    requestAnimationFrame(tick);
  };

  show(location.hash.slice(1));
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
