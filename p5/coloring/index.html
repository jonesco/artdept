<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Coloring Page | Jonesco Art Dept.</title>
<meta name="description" content="A new black-and-white coloring page every time you reload. Print it and color it in.">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
<style>
  :root { --ink: #000; --paper: #fff; --gray: #6b7280; --line: #d1d5db; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f4f6; color: var(--ink); font-family: "Libre Franklin", system-ui, sans-serif; }
  header { background: var(--ink); color: var(--paper); padding: 20px 16px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  header p { margin: 4px 0 0; font-size: 14px; color: #d1d5db; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 16px; }
  .seg { display: flex; border: 2px solid var(--ink); }
  button { font: 600 14px "Libre Franklin", system-ui, sans-serif; padding: 10px 16px; background: var(--paper); color: var(--ink); border: 0; cursor: pointer; }
  .seg button + button { border-left: 2px solid var(--ink); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button.solid { background: var(--ink); color: var(--paper); border: 2px solid var(--ink); }
  button.line { border: 2px solid var(--ink); }
  button:hover:not([aria-pressed="true"]) { background: #e5e7eb; }
  button.solid:hover { background: #333 !important; }
  button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  main { display: flex; justify-content: center; padding: 0 16px 40px; }
  #page canvas { display: block; width: min(100%, 680px) !important; height: auto !important; background: var(--paper); box-shadow: 0 2px 16px rgba(0,0,0,.18); }
  #page { width: 100%; display: flex; justify-content: center; }
  footer { text-align: center; font-size: 13px; color: var(--gray); padding: 0 16px 32px; }
  @page { size: letter; margin: 0; }
  @media print {
    body { background: #fff; }
    header, .bar, footer { display: none; }
    main { padding: 0; }
    #page canvas { width: 8.5in !important; height: 11in !important; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Free coloring page</h1>
  <p>A new one every time. Print it, color it, share it.</p>
</header>
<div class="bar">
  <div class="seg" role="group" aria-label="Page type">
    <button data-type="mandala" aria-pressed="false">Mandala</button>
    <button data-type="pattern" aria-pressed="false">Pattern</button>
    <button data-type="maze" aria-pressed="false">Maze</button>
  </div>
  <button class="solid" id="again">New page</button>
  <button class="line" id="print">Print</button>
  <button class="line" id="save">Save PNG</button>
</div>
<main><div id="page"></div></main>
<footer>Letter size, black on white. <a href="/" style="color:inherit">Jonesco Art Dept.</a></footer>

<script>
// US Letter at 100 px per inch; the canvas is drawn at 2x so the PNG is 1700 x 2200.
const W = 850, H = 1100, INK = '#000', LINE = 3.2;
const TYPES = ['mandala', 'pattern', 'maze'];
let type, seed, ctx;

function readHash() {
  const m = location.hash.match(/^#(mandala|pattern|maze)-(\d+)$/);
  if (m) { type = m[1]; seed = +m[2]; return; }
  type = random(TYPES); seed = Math.floor(Math.random() * 1e6);
  writeHash();
}
function writeHash() { history.replaceState(null, '', '#' + type + '-' + seed); }

function setup() {
  pixelDensity(2);
  const c = createCanvas(W, H);
  c.parent('page');
  ctx = drawingContext;
  noLoop();
  readHash();
  document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
    type = b.dataset.type; seed = Math.floor(Math.random() * 1e6); writeHash(); redraw();
  }));
  document.getElementById('again').addEventListener('click', () => { seed = Math.floor(Math.random() * 1e6); writeHash(); redraw(); });
  document.getElementById('print').addEventListener('click', () => window.print());
  document.getElementById('save').addEventListener('click', () => saveCanvas('jonesco-coloring-' + type + '-' + seed, 'png'));
}

function draw() {
  document.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === type));
  randomSeed(seed);
  background(255);
  ctx.strokeStyle = INK; ctx.lineWidth = LINE; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (type === 'mandala') drawMandala();
  else if (type === 'pattern') drawPattern();
  else drawMaze();
  if (type !== 'maze') frame();
}

function frame() {
  ctx.lineWidth = 5; ctx.lineJoin = 'miter';
  ctx.strokeRect(36, 36, W - 72, H - 72);
  ctx.lineWidth = LINE; ctx.lineJoin = 'round';
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }

/* ---------- Mandala ---------- */
function drawMandala() {
  const cx = W / 2, cy = H / 2, R = 350;
  const n = random([12, 16, 20, 24]), a = Math.PI * 2 / n;
  const motifs = ['petal', 'petal', 'circles', 'teeth', 'double', 'beads'];
  ctx.save(); ctx.translate(cx, cy);
  circ(0, 0, 16); circ(0, 0, 30);
  let r = 30, ring = 0, prev = null;
  while (r < R - 30) {
    let w = Math.min(random(34, 62), R - r);
    if (R - r - w < 40) w = R - r;
    let m = random(motifs);
    if (m === prev) m = random(motifs);
    prev = m;
    if (r + w >= R) m = 'petal';
    ring++;
    ctx.save();
    ctx.rotate(ring % 2 ? 0 : a / 2);
    for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(i * a); motif(m, r, w, a); ctx.restore(); }
    ctx.restore();
    r += w;
    circ(0, 0, r);
  }
  ctx.restore();
}
function motif(kind, r, w, a) {
  const half = (r + w / 2) * a / 2;
  if (kind === 'petal' || kind === 'double') {
    petal(r, w, Math.min(half * 0.8, w * 0.5));
    if (kind === 'double') petal(r + w * 0.22, w * 0.56, Math.min(half * 0.5, w * 0.3));
  } else if (kind === 'circles') {
    const d = Math.min(w * 0.4, half * 0.8);
    circ(r + w / 2, 0, d); circ(r + w / 2, 0, d * 0.5);
  } else if (kind === 'teeth') {
    const h = half * 0.9;
    ctx.beginPath(); ctx.moveTo(r, -h); ctx.lineTo(r + w, 0); ctx.lineTo(r, h); ctx.stroke();
  } else if (kind === 'beads') {
    const d = Math.min(w * 0.18, half * 0.4);
    circ(r + w * 0.3, 0, d); circ(r + w * 0.7, 0, d);
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(r + w * 0.3 - d, 0); ctx.moveTo(r + w * 0.3 + d, 0);
    ctx.lineTo(r + w * 0.7 - d, 0); ctx.moveTo(r + w * 0.7 + d, 0); ctx.lineTo(r + w, 0); ctx.stroke();
  }
}
function petal(r, w, pw) {
  ctx.beginPath(); ctx.moveTo(r, 0);
  ctx.bezierCurveTo(r + w * 0.25, -pw, r + w * 0.75, -pw, r + w, 0);
  ctx.bezierCurveTo(r + w * 0.75, pw, r + w * 0.25, pw, r, 0);
  ctx.stroke();
}

/* ---------- Pattern ---------- */
function drawPattern() {
  ctx.save();
  ctx.beginPath(); ctx.rect(36, 36, W - 72, H - 72); ctx.clip();
  if (random() < 0.5) truchet(); else scales();
  ctx.restore();
}
function truchet() {
  const cols = random([8, 10, 12]), s = (W - 72) / cols, rows = Math.ceil((H - 72) / s);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = 36 + i * s, y = 36 + j * s, flip = random() < 0.5, h = s / 2;
    ctx.beginPath();
    if (flip) {
      ctx.moveTo(x + h, y); ctx.arc(x, y, h, 0, Math.PI / 2);
      ctx.moveTo(x + s - h, y + s); ctx.arc(x + s, y + s, h, Math.PI, Math.PI * 1.5);
    } else {
      ctx.moveTo(x + s - h, y); ctx.arc(x + s, y, h, Math.PI, Math.PI / 2, true);
      ctx.moveTo(x + h, y + s); ctx.arc(x, y + s, h, 0, -Math.PI / 2, true);
    }
    ctx.stroke();
  }
}
function scales() {
  const r = random([36, 44, 52]), rings = r > 40 ? 3 : 2;
  const rows = Math.ceil(H / (r / 2)) + 3;
  for (let j = 0; j < rows; j++) {
    const y = 36 + j * (r / 2), off = j % 2 ? r : 0;
    for (let x = 36 - r * 2 + off; x < W; x += r * 2) {
      for (let k = 0; k < rings; k++) {
        const rr = r * (1 - k / rings);
        ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2);
        if (k === 0) { ctx.fillStyle = '#fff'; ctx.fill(); }
        ctx.stroke();
      }
    }
  }
}

/* ---------- Maze ---------- */
function drawMaze() {
  const cols = 15, rows = 19, s = 50, x0 = (W - cols * s) / 2, y0 = (H - rows * s) / 2;
  const cell = []; // walls: 0 top, 1 right, 2 bottom, 3 left
  for (let i = 0; i < cols * rows; i++) cell.push([1, 1, 1, 1]);
  const seen = new Array(cols * rows).fill(false), stack = [0]; seen[0] = true;
  const dirs = [[0, -1, 0, 2], [1, 0, 1, 3], [0, 1, 2, 0], [-1, 0, 3, 1]];
  while (stack.length) {
    const cur = stack[stack.length - 1], cx = cur % cols, cy = Math.floor(cur / cols);
    const opts = dirs.filter(d => {
      const nx = cx + d[0], ny = cy + d[1];
      return nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[ny * cols + nx];
    });
    if (!opts.length) { stack.pop(); continue; }
    const d = random(opts), nxt = (cy + d[1]) * cols + cx + d[0];
    cell[cur][d[2]] = 0; cell[nxt][d[3]] = 0; seen[nxt] = true; stack.push(nxt);
  }
  cell[0][0] = 0; cell[cols * rows - 1][2] = 0; // entrance top left, exit bottom right
  ctx.lineWidth = 4.5; ctx.lineCap = 'square'; ctx.beginPath();
  for (let i = 0; i < cols * rows; i++) {
    const x = x0 + (i % cols) * s, y = y0 + Math.floor(i / cols) * s, c = cell[i];
    if (c[0]) { ctx.moveTo(x, y); ctx.lineTo(x + s, y); }
    if (c[3]) { ctx.moveTo(x, y); ctx.lineTo(x, y + s); }
    if (i % cols === cols - 1 && c[1]) { ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); }
    if (Math.floor(i / cols) === rows - 1 && c[2]) { ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); }
  }
  ctx.stroke();
  ctx.fillStyle = INK; ctx.font = '700 16px "Libre Franklin", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('START', x0, y0 - 14);
  ctx.textAlign = 'right'; ctx.fillText('FINISH', x0 + cols * s, y0 + rows * s + 28);
}
</script>
</body>
</html>
